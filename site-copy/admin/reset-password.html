<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova senha — Painel Tô Na Arara</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body admin-body--center">

<main class="login-card">
  <img class="login-logo" src="../assets/img/logo.png" alt="Tô Na Arara" width="56" height="56" />
  <h1>Criar nova senha</h1>
  <p class="login-sub">Defina uma nova senha para acessar o painel.</p>

  <form id="resetForm" class="admin-form" novalidate>
    <label>
      Nova senha
      <input type="password" name="password" autocomplete="new-password" minlength="6" maxlength="72" required autofocus />
    </label>
    <label>
      Confirmar nova senha
      <input type="password" name="confirmPassword" autocomplete="new-password" minlength="6" maxlength="72" required />
    </label>
    <p id="resetError" class="form-error" hidden></p>
    <p id="resetSuccess" class="form-success" hidden></p>
    <button type="submit" id="resetSubmitBtn" class="btn btn-mustard" style="width:100%; justify-content:center;">Salvar nova senha</button>
  </form>

  <a class="login-back" href="login.html">&larr; Voltar para o login</a>
</main>

<script src="admin.js" defer></script>
</body>
</html>
